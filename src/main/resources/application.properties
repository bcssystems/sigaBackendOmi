spring.application.name=siga
server.port=8021

spring.jackson.time-zone=America/Mexico_City
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/intranet_omi
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.upload.public-dir=${APP_UPLOAD_PUBLIC_DIR:./uploads/multimedia}
app.upload.private-dir=${APP_UPLOAD_PRIVATE_DIR:./uploads/privados}
app.google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

application.security.jwt.secret-key=${JWT_SECRET_KEY:miClaveSecretaMuySeguraQueEsLoSuficientementeLarga}
application.security.jwt.expiration=${JWT_ACCESS_EXPIRATION:900000}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:604800000}
app.security.cookies.secure=${SECURE_COOKIES:true}
app.security.cookies.same-site=${COOKIE_SAME_SITE:Lax}
app.security.cors.origins=${APP_CORS_ORIGINS:https://sigademo.omisoltec.mx,https://sigashop.omisoltec.mx,http://127.0.0.1:5500}
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.window-seconds=${LOGIN_WINDOW_SECONDS:900}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
app.security.seed-admin.username=${SEED_ADMIN_USERNAME:admin}
app.security.seed-admin.password=${SEED_ADMIN_PASSWORD:1234}
